version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: prometheus_db
    restart: always
    environment:
      POSTGRES_DB: prometheus_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Discord Bot Service
  bot:
    build:
      context: ./bot/TitanBot-main
      dockerfile: Dockerfile
    container_name: prometheus_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=your_discord_token_here
      - GEMINI_API_KEY=your_gemini_key_here
      - CLIENT_ID=1532437892318892144
      - PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=prometheus_bot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_password_123
      - NODE_ENV=production
    ports:
      - "3000:3000"

  # 3. Next.js Web Dashboard & Landing Page
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: prometheus_dashboard
    restart: always
    depends_on:
      - bot
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://bot:3000
      - NODE_ENV=production
    ports:
      - "3001:3001"

volumes:
  pgdata:
